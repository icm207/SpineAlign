<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpineAlign - Iniciar Sesión</title>
  <link rel="stylesheet" href="assets/css/styleevaluar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos específicos para la vista de login centrada */
    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .tarjeta-login {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      border: 1px solid #e2e8f0;
    }
    .tarjeta-login h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .tarjeta-login p.subtitulo {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .grupo-formulario {
      margin-bottom: 1.25rem;
    }
    .grupo-formulario label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    .grupo-formulario input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .grupo-formulario input:focus {
      border-color: rgb(67, 67, 176);
      box-shadow: 0 0 0 3px rgba(67, 67, 176, 0.1);
    }
    .btn-submit-login {
      width: 100%;
      background-color: rgb(67, 67, 176);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit-login:hover {
      background-color: #3737b0;
    }
    .login-footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }
    .login-footer-text a {
      color: rgb(67, 67, 176);
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="barra-navegacion">
    <a href="index.html">
      <img src="assets/img/iotipo-.png" alt="Isotipo SpineAlign" class="logo">
    </a>
    
    <nav class="menu-derecha" aria-label="Principal">
      <a href="index.html">Inicio</a>
      <a href="evaluar.html">Evaluación</a>
    </nav>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL LOGIN -->
  <main class="login-container">
    <div class="tarjeta-login">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo">Accede a tu cuenta profesional de SpineAlign</p>
      
      <form id="form-login">
        <div class="grupo-formulario">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="medico@spinealign.com" required>
        </div>

        <div class="grupo-formulario">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit-login">Ingresar al Sistema</button>
      </form>

      <div class="login-footer-text">
        ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>
      <strong>SpineAlign es una herramienta de apoyo.</strong> No sustituye el diagnóstico ni la valoración de un profesional de la salud.
    </p>
    <p class="copyright">© 2026 SpineAlign - Todos los derechos reservados</p>
  </footer>

  <!-- SCRIPT DE MANEJO DE LOGIN -->
  <script>
    const formLogin = document.getElementById('form-login');

    formLogin.addEventListener('submit', (e) => {
      e.preventDefault(); // Evitamos que la página recargue por defecto

      const emailInput = document.getElementById('email').value;
      const passwordInput = document.getElementById('password').value;

      // Validación simple de ejemplo (aquí en el futuro conectarás tu API de Node.js con MongoDB)
      if (emailInput && passwordInput) {
        // Simulamos la creación del token de sesión exitosa
        localStorage.setItem('token', 'fake-jwt-token-valido-2026');
        
        alert("¡Inicio de sesión exitoso! Bienvenido, " + emailInput);

        // Redirigir de vuelta a la sección de evaluación (o al panel principal)
        window.location.href = 'evaluar.html';
      } else {
        alert("Por favor, completa todos los campos.");
      }
    });
  </script>

</body>
</html>
